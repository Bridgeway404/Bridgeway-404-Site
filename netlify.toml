# ============================================================
# netlify.toml — Bridgeway 404
# Netlify configuration file. Commit this to your repo root.
# ============================================================

[build]
  # This is a plain HTML site — no build step needed.
  # If you add a build step later (e.g. Astro, Vite), update
  # the command and publish fields below.
  publish = "."
  command = ""

# ---- Security and caching headers ----
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options         = "DENY"
    X-Content-Type-Options  = "nosniff"
    X-XSS-Protection        = "1; mode=block"
    Referrer-Policy         = "strict-origin-when-cross-origin"
    Permissions-Policy      = "camera=(), microphone=(), geolocation=()"
    # Update Content-Security-Policy as needed if you add external scripts
    # connect-src includes the Bridgeway Supabase project, used only by the /admin panel
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https://images.unsplash.com data:; connect-src 'self' https://ctqdnphsvkbgegdtsmwb.supabase.co;"

# Admin panel: never index, never cache the shell aggressively
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Public-site stylesheet and script live outside /assets on purpose so edits go
# live immediately (Netlify's default: revalidate on every request).

# Long-lived cache for /assets/* — this includes the branded social share
# card (assets/bridgeway404-social-preview-v3.png) and the logo files in
# assets/brand/. Because these are cached as
# immutable for a year, always ship a NEW filename (-v2, -v3, ...) when the
# share image changes, and update the og:image / twitter:image URLs to match.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---- Redirects ----
# Redirect www to non-www (update domain if needed)
[[redirects]]
  from   = "https://www.bridgeway404.com/*"
  to     = "https://bridgeway404.com/:splat"
  status = 301
  force  = true

# /privacy short-link forwards to the real privacy policy page
[[redirects]]
  from   = "/privacy"
  to     = "/privacy-policy.html"
  status = 301
  force  = true

# Placeholder for terms page — remove once a real terms page exists
[[redirects]]
  from   = "/terms"
  to     = "/"
  status = 302

# Friendly short links for the redesigned public site
[[redirects]]
  from   = "/contact"
  to     = "/quote/#contact"
  status = 301

[[redirects]]
  from   = "/get-a-quote"
  to     = "/quote/"
  status = 301

[[redirects]]
  from   = "/commercial-partners"
  to     = "/commercial/"
  status = 301

[[redirects]]
  from   = "/partners"
  to     = "/commercial/"
  status = 301

[[redirects]]
  from   = "/about-us"
  to     = "/about/"
  status = 301

[[redirects]]
  from   = "/nominate"
  to     = "/service-saturdays/#nominate"
  status = 301

# Internal repo directories — never serve these publicly
[[redirects]]
  from   = "/docs/*"
  to     = "/index.html"
  status = 404
  force  = true

[[redirects]]
  from   = "/supabase/*"
  to     = "/index.html"
  status = 404
  force  = true

# Source/maintenance folders for the public site (shared partials, scripts)
[[redirects]]
  from   = "/partials/*"
  to     = "/index.html"
  status = 404
  force  = true

[[redirects]]
  from   = "/tools/*"
  to     = "/index.html"
  status = 404
  force  = true

# ---- Form spam protection ----
# Netlify automatically handles form submissions when data-netlify="true"
# is set on the <form> element. No additional config needed here.
# To set up email notifications:
#   Netlify dashboard > Your site > Forms > Form notifications
