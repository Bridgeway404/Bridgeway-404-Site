*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;color:#fff;
  background:
    radial-gradient(900px 600px at 50% -10%, rgba(255,255,255,.10), transparent 60%),
    linear-gradient(160deg,#4e2c72 0%,#3a1f57 45%,#1a0f2e 100%);
  position:relative}
.stripe{position:absolute;left:-200px;right:-200px;height:14px;background:linear-gradient(90deg,#a8821f,#c49a30,#e2c25a,#c49a30,#a8821f);transform:rotate(-8deg);opacity:.9}
.stripe.a{top:150px}.stripe.b{top:176px;height:5px;opacity:.55}
.card{position:absolute;left:50%;top:36px;transform:translateX(-50%);width:480px;height:336px;border-radius:26px;background:#f8f7f5;box-shadow:0 18px 50px rgba(0,0,0,.45);overflow:hidden}
.card img{position:absolute;width:960px;height:504px;left:-240px;top:-12px}
.eyebrow{position:absolute;top:386px;width:100%;text-align:center;font-weight:800;font-size:36px;letter-spacing:.22em;color:#e2c25a;text-transform:uppercase}
