<!DOCTYPE html>
<!-- Source for assets/bridgeway404-social-preview-v3.png (1200x630 link-preview card).
     Regenerate: serve the repo root (python3 -m http.server 8080), open
     http://localhost:8080/tools/social-card-v3.html in Chrome at exactly 1200x630 and screenshot.
     Ship any change under a NEW filename (-v4) — /assets is cached for a year. -->
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@500;700&display=swap">
<style>
  *{margin:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{display:grid;grid-template-columns:520px 1fr;font-family:Inter,sans-serif;background:#fff}
  .left{position:relative;display:grid;place-items:center;background:#fff}
  .left img{width:430px}
  .left::after{content:'';position:absolute;right:0;top:60px;bottom:60px;width:4px;background:#fdbc08;border-radius:4px}
  .right{position:relative;overflow:hidden;color:#fff;padding:78px 64px 0 60px;
    background:radial-gradient(600px 300px at 90% 0%,rgba(167,85,231,.35),transparent 60%),linear-gradient(140deg,#050505 0%,#16052a 40%,#340d57 100%)}
  .right::before{content:'';position:absolute;width:1100px;height:420px;right:-420px;bottom:-330px;border-radius:50%;border-top:10px solid #fdbc08;transform:rotate(-10deg)}
  .right::after{content:'';position:absolute;width:1100px;height:420px;right:-440px;bottom:-360px;border-radius:50%;background:#5e1c78;transform:rotate(-10deg)}
  .sky{position:absolute;left:40px;bottom:0;width:640px;opacity:.08;filter:brightness(0) invert(1)}
  .eyebrow{font-size:18px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#ffcb3d;display:flex;gap:12px;align-items:center}
  .eyebrow::before{content:'';width:34px;height:4px;background:#fdbc08;border-radius:3px}
  h1{font-family:'Barlow Condensed',sans-serif;font-weight:800;text-transform:uppercase;font-size:76px;line-height:.98;margin-top:22px}
  h1 span{color:#fdbc08;display:block}
  .phone{position:relative;z-index:1;margin-top:34px;display:inline-flex;align-items:center;gap:14px;background:#fdbc08;color:#121016;font-weight:700;font-size:28px;padding:14px 26px;border-radius:999px}
  .url{position:relative;z-index:1;margin-top:18px;font-size:20px;color:rgba(255,255,255,.82);font-weight:500;letter-spacing:.02em}
</style></head><body>
  <div class="left"><img src="/assets/brand/logo-full-light-v1.png" alt=""></div>
  <div class="right">
    <img class="sky" src="/assets/brand/icon-skyline-dark-v1.png" alt="">
    <p class="eyebrow">Metro Atlanta · Locally owned</p>
    <h1>Junk Removal &amp; Property Cleanouts <span>Done Right.</span></h1>
    <div class="phone">Call or text 404-565-4216</div>
    <p class="url">bridgeway404.com</p>
  </div>
</body></html>
